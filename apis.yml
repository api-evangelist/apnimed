aid: apnimed
name: Apnimed
description: 'Apnimed is a late-stage clinical-stage pharmaceutical company headquartered
  in Cambridge, Massachusetts, developing novel oral drug therapies for sleep-related
  breathing disorders. Its lead candidate AD109 (Oxnimbi) is a fixed-dose combination
  of an anti-muscarinic and a selective norepinephrine reuptake inhibitor, designed
  to improve upper-airway muscle activity and treat an underlying neuromuscular cause
  of obstructive sleep apnea (OSA) rather than manage it mechanically. The company
  was founded in 2017, partners with Shionogi through the Shionogi-Apnimed Sleep Science
  (SASS) joint venture, and had a New Drug Application for AD109 accepted by the FDA
  in 2026. Apnimed is a drug developer, not a software vendor: it publishes no developer
  portal, API documentation, or machine-readable API artifacts.'
